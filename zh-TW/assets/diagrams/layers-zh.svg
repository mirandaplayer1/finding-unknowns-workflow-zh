<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="-apple-system,'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="900" height="520" fill="#FAF7F0"/>
